<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Игротека</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="shared/theme.css?v=82">
<link rel="stylesheet" href="catalog/catalog.css?v=82">
<!-- Хранилище и тема в <head>, чтобы тема применялась до первой отрисовки -->
<script src="shared/storage.js?v=82"></script>
<script src="shared/theme.js?v=82"></script>
</head>
<body>
<noscript><p class="noscript" id="noscript">Для работы сайта нужен включённый JavaScript.</p></noscript>

<div class="page">
  <header class="topbar">
    <a class="brand" href="index.html" data-i18n-aria-label="platform.logoLabel">
      <svg class="brand-logo" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="12" width="13" height="13" rx="4" fill="var(--accent)" transform="rotate(-10 8 18)"/>
        <rect x="17" y="6" width="13" height="13" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" transform="rotate(8 23 12)"/>
        <rect x="11" y="18" width="12" height="12" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
      </svg>
      <span class="brand-name" data-i18n="platform.name"></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" type="button"></button>
      <button class="avatar-btn" id="avatar-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu" data-i18n-aria-label="profile.menuLabel"></button>
    </div>
    <div class="menu" id="profile-menu" role="menu" hidden>
      <button class="menu-item" id="open-profile" type="button" role="menuitem" data-i18n="profile.title"></button>
      <button class="menu-item" id="open-stats" type="button" role="menuitem" data-i18n="stats.title"></button>
      <button class="menu-item" id="cloud-action" type="button" role="menuitem"></button>
      <p class="menu-status" id="cloud-status" role="status"></p>
    </div>
  </header>

  <main class="content">
    <!-- Кошелёк: баланс аконов, серия дней, бонус дня -->
    <div class="wallet-bar" id="wallet-bar">
      <button class="chip" id="wallet-open" type="button" aria-haspopup="dialog">
        <svg class="chip-icon coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><path d="M8.5 12.5l2.4 2.4 4.6-5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <b id="wallet-balance"></b><span id="wallet-unit"></span>
      </button>
      <button class="chip streak" id="streak-chip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal-pop">
        <svg class="chip-icon flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.6 3.2-1.3 4.6-3 6.6-1.6 1.9-2.6 3.6-2.6 6a5.6 5.6 0 0 0 11.2 0c0-2.2-.9-3.7-2-5 0 1.5-.7 2.5-1.7 2.9.5-3.3-.5-7-1.9-10.5z" fill="currentColor"/></svg>
        <b id="streak-count"></b>
      </button>
      <button class="btn-claim" id="claim-btn" type="button" hidden></button>
      <div class="cal-pop" id="cal-pop" role="dialog" aria-labelledby="cal-title" hidden>
        <div class="cal-top">
          <svg class="flame big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.6 3.2-1.3 4.6-3 6.6-1.6 1.9-2.6 3.6-2.6 6a5.6 5.6 0 0 0 11.2 0c0-2.2-.9-3.7-2-5 0 1.5-.7 2.5-1.7 2.9.5-3.3-.5-7-1.9-10.5z" fill="currentColor"/></svg>
          <div><div class="cal-label" data-i18n="cal.title"></div><div class="cal-count" id="cal-count"></div><div class="cal-best" id="cal-best"></div></div>
          <button class="icon-btn" id="cal-close" type="button" data-i18n-aria-label="wallet.close">✕</button>
        </div>
        <div class="cal-month" id="cal-title"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

    <!-- Главный постер: скрыт, пока игра не выбрана -->
    <div class="poster-wrap" id="poster-wrap">
      <div class="poster-clip">
        <section class="poster" id="poster" data-i18n-aria-label="catalog.posterLabel">
          <div class="poster-cover"><img id="poster-cover" alt="" width="200" height="250"></div>
          <div class="poster-body">
            <h2 class="poster-title" id="poster-title"></h2>
            <p class="poster-desc" id="poster-desc"></p>
            <div class="poster-actions" id="poster-actions"></div>
          </div>
          <button class="poster-close" id="poster-close" type="button" data-i18n-aria-label="catalog.close">✕</button>
        </section>
      </div>
    </div>

    <h1 class="title" data-i18n="catalog.title"></h1>
    <p class="subtitle" data-i18n="catalog.subtitle"></p>
    <div class="grid" id="grid" role="list" data-i18n-aria-label="catalog.gridLabel"></div>
    <div class="empty" id="catalog-empty" hidden data-i18n="catalog.empty"></div>
  </main>

  <footer class="footer" id="footer">
    <div class="footer-row">
      <a class="footer-brand" href="index.html" data-i18n-aria-label="platform.logoLabel"><span data-i18n="platform.name"></span></a>
      <nav class="footer-links" data-i18n-aria-label="footer.feedback">
        <a href="https://github.com/Isko071/projeckt_one/issues/new?title=%D0%9E%D1%88%D0%B8%D0%B1%D0%BA%D0%B0%3A%20" target="_blank" rel="noopener" data-i18n="footer.bug"></a>
        <a href="https://github.com/Isko071/projeckt_one/issues/new?title=%D0%98%D0%B4%D0%B5%D1%8F%3A%20" target="_blank" rel="noopener" data-i18n="footer.idea"></a>
      </nav>
    </div>
    <p class="footer-copy"><span data-i18n="footer.copy"></span> <span id="footer-stats" data-i18n="footer.stats" hidden></span></p>
  </footer>
</div>

<dialog class="dialog account-dialog" id="account-dialog" aria-labelledby="account-title">
  <div class="wallet-head">
    <h2 class="dialog-title" id="account-title"></h2>
    <button class="icon-btn" id="account-close" type="button" data-i18n-aria-label="wallet.close">✕</button>
  </div>
  <div class="account-form" id="account-body"></div>
</dialog>

<dialog class="dialog" id="profile-dialog" aria-labelledby="profile-title">
  <form class="profile-form" id="profile-form" method="dialog">
    <h2 class="dialog-title" id="profile-title" data-i18n="profile.title"></h2>
    <label class="field">
      <span class="field-label" data-i18n="profile.name"></span>
      <input class="text-input" id="profile-name" name="name" type="text" maxlength="20" autocomplete="nickname">
    </label>
    <div class="field" id="photo-field" hidden>
      <span class="field-label" data-i18n="profile.photo"></span>
      <button class="photo-toggle" id="photo-toggle" type="button" aria-pressed="false">
        <img id="photo-preview" alt="" width="40" height="40" referrerpolicy="no-referrer">
        <span data-i18n="profile.photo.use"></span>
      </button>
    </div>
    <div class="field">
      <span class="field-label" id="emoji-label" data-i18n="profile.emoji"></span>
      <div class="emojis" id="emojis" role="group" aria-labelledby="emoji-label"></div>
    </div>
    <div class="field">
      <span class="field-label" id="avatar-label" data-i18n="profile.avatar"></span>
      <div class="avatars" id="avatars" role="group" aria-labelledby="avatar-label"></div>
    </div>
    <p class="dialog-note" data-i18n="profile.note"></p>
    <div class="dialog-actions">
      <button class="btn-secondary" id="profile-cancel" type="button" data-i18n="profile.cancel"></button>
      <button class="btn-primary" type="submit" data-i18n="profile.save"></button>
    </div>
  </form>
</dialog>

<dialog class="dialog wallet-dialog" id="wallet-dialog" aria-labelledby="wallet-title">
  <div class="wallet-head">
    <h2 class="dialog-title" id="wallet-title" data-i18n="wallet.title"></h2>
    <button class="icon-btn" id="wallet-close" type="button" data-i18n-aria-label="wallet.close">✕</button>
  </div>
  <div class="wallet-balance"><small data-i18n="wallet.balance"></small><div><b id="wd-balance"></b> <span id="wd-unit"></span></div></div>
</dialog>

<dialog class="dialog wallet-dialog" id="stats-dialog" aria-labelledby="stats-title">
  <div class="wallet-head">
    <h2 class="dialog-title" id="stats-title" data-i18n="stats.title"></h2>
    <button class="icon-btn" id="stats-close" type="button" data-i18n-aria-label="wallet.close">✕</button>
  </div>
  <section aria-labelledby="rec-title">
    <h3 id="rec-title" data-i18n="wallet.records.title"></h3>
    <dl class="records" id="wd-records"></dl>
  </section>
  <section aria-labelledby="log-title">
    <h3 id="log-title" data-i18n="wallet.log.title"></h3>
    <ul class="log" id="wd-log"></ul>
  </section>
</dialog>

<script src="locales/ru.js?v=82"></script>
<script src="shared/i18n.js?v=82"></script>
<script src="shared/profile.js?v=82"></script>
<script src="shared/wallet.js?v=82"></script>
<script src="shared/progress.js?v=82"></script>
<script src="shared/sync-logic.js?v=82"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="shared/firebase-config.js?v=82"></script>
<script src="shared/analytics.js?v=82"></script>
<script src="shared/cloud.js?v=82"></script>
<script src="games/games.js?v=82"></script>
<script src="catalog/logic.js?v=82"></script>
<script src="catalog/catalog.js?v=82"></script>
<script src="catalog/profile-ui.js?v=82"></script>
<script src="catalog/wallet-ui.js?v=82"></script>
<script src="catalog/account-ui.js?v=82"></script>
</body>
</html>
