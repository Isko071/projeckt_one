<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Игротека</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="catalog/catalog.css">
<!-- Хранилище и тема в <head>, чтобы тема применялась до первой отрисовки -->
<script src="shared/storage.js"></script>
<script src="shared/theme.js"></script>
</head>
<body>
<noscript><p class="noscript" id="noscript">Для работы сайта нужен включённый JavaScript.</p></noscript>

<div class="page">
  <header class="topbar">
    <a class="brand" href="index.html" data-i18n-aria-label="platform.logoLabel">
      <svg class="brand-logo" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="12" width="13" height="13" rx="4" fill="var(--accent)" transform="rotate(-10 8 18)"/>
        <rect x="17" y="6" width="13" height="13" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" transform="rotate(8 23 12)"/>
        <rect x="11" y="18" width="12" height="12" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
      </svg>
      <span class="brand-name" data-i18n="platform.name"></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" type="button"></button>
      <button class="avatar-btn" id="avatar-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu" data-i18n-aria-label="profile.menuLabel"></button>
    </div>
    <div class="menu" id="profile-menu" role="menu" hidden>
      <button class="menu-item" id="open-profile" type="button" role="menuitem" data-i18n="profile.title"></button>
    </div>
  </header>

  <main class="content">
    <!-- Главный постер: скрыт, пока игра не выбрана -->
    <div class="poster-wrap" id="poster-wrap">
      <div class="poster-clip">
        <section class="poster" id="poster" data-i18n-aria-label="catalog.posterLabel">
          <div class="poster-cover"><img id="poster-cover" alt="" width="200" height="250"></div>
          <div class="poster-body">
            <h2 class="poster-title" id="poster-title"></h2>
            <p class="poster-desc" id="poster-desc"></p>
            <div class="poster-actions" id="poster-actions"></div>
          </div>
          <button class="poster-close" id="poster-close" type="button" data-i18n-aria-label="catalog.close">✕</button>
        </section>
      </div>
    </div>

    <h1 class="title" data-i18n="catalog.title"></h1>
    <p class="subtitle" data-i18n="catalog.subtitle"></p>
    <div class="grid" id="grid" role="list" data-i18n-aria-label="catalog.gridLabel"></div>
    <div class="empty" id="catalog-empty" hidden data-i18n="catalog.empty"></div>
  </main>
</div>

<dialog class="dialog" id="profile-dialog" aria-labelledby="profile-title">
  <form class="profile-form" id="profile-form" method="dialog">
    <h2 class="dialog-title" id="profile-title" data-i18n="profile.title"></h2>
    <label class="field">
      <span class="field-label" data-i18n="profile.name"></span>
      <input class="text-input" id="profile-name" name="name" type="text" maxlength="20" autocomplete="nickname">
    </label>
    <div class="field">
      <span class="field-label" id="avatar-label" data-i18n="profile.avatar"></span>
      <div class="avatars" id="avatars" role="group" aria-labelledby="avatar-label"></div>
    </div>
    <p class="dialog-note" data-i18n="profile.note"></p>
    <div class="dialog-actions">
      <button class="btn-secondary" id="profile-cancel" type="button" data-i18n="profile.cancel"></button>
      <button class="btn-primary" type="submit" data-i18n="profile.save"></button>
    </div>
  </form>
</dialog>

<script src="locales/ru.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/profile.js"></script>
<script src="games/games.js"></script>
<script src="catalog/logic.js"></script>
<script src="catalog/catalog.js"></script>
<script src="catalog/profile-ui.js"></script>
</body>
</html>
